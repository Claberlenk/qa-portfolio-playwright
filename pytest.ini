[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    ui: UI tests (Playwright / saucedemo.com)
    api: API tests (Requests / reqres.in)
    smoke: Smoke tests
    regression: Regression tests

addopts =
    --strict-markers
    -v
    --tb=short
